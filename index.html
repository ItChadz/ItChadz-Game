<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ItChadz Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#0f172a;
color:white;
}

/* Header */

header{
display:flex;
align-items:center;
padding:15px;
gap:10px;
background:#111827;
position:sticky;
top:0;
z-index:10;
box-shadow:0 3px 10px rgba(0,0,0,.4);
}

.menu{
font-size:30px;
cursor:pointer;
}

.search{
flex:1;
position:relative;
}

.search input{
width:100%;
padding:12px 45px;
border:none;
border-radius:30px;
font-size:17px;
background:#1e293b;
color:white;
outline:none;
}

.search span{
position:absolute;
left:15px;
top:11px;
font-size:20px;
}

/* Banner */

.banner{

margin:20px;
height:170px;
border-radius:20px;
overflow:hidden;
background:linear-gradient(45deg,#3b82f6,#06b6d4);
display:flex;
align-items:center;
justify-content:center;
font-size:35px;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.4);

}

/* Grid */

.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
padding:20px;

}

/* Card */

.card{

background:#1e293b;
border-radius:15px;
overflow:hidden;
transition:.3s;
box-shadow:0 4px 10px rgba(0,0,0,.4);

}

.card:hover{

transform:translateY(-8px);

}

.card img{

width:100%;
height:170px;
object-fit:cover;

}

.info{

padding:12px;

}

.title{

font-size:20px;
font-weight:bold;

}

.rating{

margin:6px 0;
color:gold;

}

button{

width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#3b82f6;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#2563eb;

}

a{
text-decoration:none;
}

</style>
</head>
<body>

<header>

<div class="menu">☰</div>

<div class="search">

<span>🔍</span>

<input type="text"
placeholder="Search Game..."
id="search"
onkeyup="searchGame()">

</div>

</header>

<div class="banner">

ItChadz Game

</div>

<div class="grid" id="games">

<div class="card">

<img src="Game/RoubaAdventure/thubnail.png">

<div class="info">

<div class="title">Rouba's Adventure</div>

<div class="info">By ItChadz</div>

<div class="rating">★★★★★</div>

<a href="Game/RoubaAdventure/index.html">

<button>Play</button>

</a>

</div>

</div>

<div class="card">

<img src="Game/JastBasic/thubnail.jpg">

<div class="info">

<div class="title">Jast's Brand New Slapping Game</div>

<div class="info">by Jast</div>

<div class="info">An endless clicker game that you must click jast</div>

<div class="rating">★★★★☆</div>

<a href="Game/JastBasic/index.html">

<button>Play</button>

</a>

</div>

</div>

<div class="card">

<img src="img/game3.jpg">

<div class="info">

<div class="title">Coming Soon</div>

<div class="rating">★★★★★</div>

<a href="game/">

<button>Coming Soon</button>

</a>

</div>

</div>

</div>

<script>

function searchGame(){

let input=document.getElementById("search").value.toLowerCase();

let card=document.querySelectorAll(".card");

card.forEach(function(c){

let title=c.querySelector(".title").innerText.toLowerCase();

if(title.includes(input))
c.style.display="block";
else
c.style.display="none";

});

}

</script>

</body>
</html>
